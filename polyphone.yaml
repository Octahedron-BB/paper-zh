# ==============================================================================
# 多音字与医学专有词发音修正词典 (Polyphone & Pronunciation Rules for TTS)
# ==============================================================================
#
# 原理说明：
# 1. 本文件专门用于在调用声音引擎 (Edge-TTS / 豆包 / CosyVoice) 前进行发音预清洗。
# 2. 【核心隔离原则】：本词典中的替换只对传给声音引擎的底层音频流生效，
#    绝对不会污染或修改屏幕上显示的中文译文、中英对照、口语讲稿或字幕文本。
# 3. 每一条规则包含：
#    - word: 原始文本中的医学/专业词汇或短语
#    - tts: 送给 TTS 声音合成引擎时的同音/谐音字替换
#    - note: 读音说明与注音理由
# ==============================================================================

rules:
  # --------------------------------------------------------------------------
  # 1. 常见医学专有名词 / 解剖 / 病理 / 术语
  # --------------------------------------------------------------------------
  - word: "黏膜"
    tts: "粘膜"
    note: "确保读 nián mó，避免部分 G2P 引擎误读为 zhān mó"

  - word: "血栓栓塞"
    tts: "血栓栓色"
    note: "确保塞读 sè，避免误读为 sāi"

  - word: "栓塞"
    tts: "栓色"
    note: "确保塞读 sè"

  - word: "梗塞"
    tts: "梗色"
    note: "确保塞读 sè"

  - word: "脑梗塞"
    tts: "脑梗色"
    note: "确保塞读 sè"

  - word: "心肌梗塞"
    tts: "心肌梗色"
    note: "确保塞读 sè"

  - word: "校正"
    tts: "矫正"
    note: "确保校读 jiào，避免误读为 xiào"

  - word: "校准"
    tts: "矫准"
    note: "确保校读 jiào"

  - word: "咽部"
    tts: "烟部"
    note: "确保咽读 yān"

  - word: "鼻咽"
    tts: "鼻烟"
    note: "确保咽读 yān"

  - word: "咽喉"
    tts: "烟喉"
    note: "确保咽读 yān"

  - word: "吞咽"
    tts: "吞燕"
    note: "确保咽读 yàn"

  - word: "下咽"
    tts: "下燕"
    note: "确保咽读 yàn"

  - word: "恶心"
    tts: "额心"
    note: "确保恶心读 ě xīn，避免误读为 è xīn"

  - word: "解剖"
    tts: "姐剖"
    note: "确保解读 jiě，避免 jiè"

  - word: "骨折"
    tts: "骨舌"
    note: "确保折读 zhé，避免 shé/zhē"

  - word: "菌株"
    tts: "军株"
    note: "确保菌读 jūn"

  - word: "真菌"
    tts: "真军"
    note: "确保菌读 jūn"

  - word: "细菌"
    tts: "细军"
    note: "确保菌读 jūn"

  - word: "杀菌"
    tts: "杀军"
    note: "确保菌读 jūn"

  - word: "处方"
    tts: "触方"
    note: "确保处读 chǔ，避免 chù"

  - word: "处于"
    tts: "触于"
    note: "确保处读 chǔ"

  - word: "重度"
    tts: "众度"
    note: "确保重读 zhòng，避免 chóng"

  - word: "重症"
    tts: "众症"
    note: "确保重读 zhòng"

  - word: "重复"
    tts: "虫复"
    note: "确保重读 chóng，避免 zhòng"

  - word: "更替"
    tts: "耕替"
    note: "确保更读 gēng，避免 gèng"

  - word: "给药"
    tts: "计药"
    note: "确保给读 jǐ，避免 gěi"

  - word: "供给"
    tts: "供挤"
    note: "确保给读 jǐ"

  - word: "显著差异"
    tts: "显著叉异"
    note: "确保差读 chā"

  - word: "差异"
    tts: "叉异"
    note: "确保差读 chā"

  - word: "参差"
    tts: "参刺"
    note: "确保差读 cī"

  - word: "腹泻"
    tts: "复泻"
    note: "确保腹读 fù"

  - word: "弥漫"
    tts: "迷漫"
    note: "确保弥读 mí"

  - word: "潜伏期"
    tts: "前伏期"
    note: "确保潜读 qián"

  # --------------------------------------------------------------------------
  # 2. 常见口语/文言多音字及书面语修饰
  # --------------------------------------------------------------------------
  - word: "为此"
    tts: "为了这个原因"
    note: "避免为字误读"

  - word: "以...为主"
    tts: "以...为(wéi)主"
    note: "为主读 wéi"
